name: Build Native macOS App (Swift + Liquid Glass)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Native Swift (.app / .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift & Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift native engine XCTest suite
        run: |
          cd macos
          swift test -v

      - name: Build native PDF Resize.app and .dmg
        run: ./build_mac_app.sh

      - name: Smoke test signed .app worker CLI
        run: |
          test -x "dist/PDF Resize.app/Contents/MacOS/PDFResize"
          codesign --verify --deep --strict "dist/PDF Resize.app"
          ls -lh dist/PDF-Resize-macOS-*.dmg

      - name: Upload macOS .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Resize-macOS-Native
          path: dist/PDF-Resize-macOS-*.dmg

  release:
    name: Publish GitHub Release
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PDF-Resize-macOS-Native/PDF-Resize-macOS-*.dmg
