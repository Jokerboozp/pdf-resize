name: Build Native Desktop Apps (macOS Swift + Windows WinUI 3)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Native Swift (.app / .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift & Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift native engine XCTest suite
        run: |
          cd macos
          swift test -v

      - name: Build native PDF Resize.app and .dmg
        run: ./build_mac_app.sh

      - name: Smoke test signed .app worker CLI
        run: |
          test -x "dist/PDF Resize.app/Contents/MacOS/PDFResize"
          codesign --verify --deep --strict "dist/PDF Resize.app"
          ls -lh dist/PDF-Resize-macOS-*.dmg

      - name: Upload macOS .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Resize-macOS-Native
          path: dist/PDF-Resize-macOS-*.dmg

  build-windows:
    name: Windows Native WinUI 3 (Fluent 2 x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained WinUI 3 desktop client (win-x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          dotnet publish windows/PDFResize.App/PDFResize.App.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            --self-contained true `
            -o dist/PDF-Resize-Windows-x64

      - name: Run Windows native engine xUnit tests
        shell: pwsh
        run: |
          dotnet test windows/PDFResize.Tests/PDFResize.Tests.csproj -c Release --verbosity normal

      - name: Smoke test published PDFResize.exe native runtime & package zip
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/PDF-Resize-Windows-x64/PDFResize.exe").Path
          Write-Host "Verified binary: $exe"
          $outLog = Join-Path $env:TEMP "selftest_out.txt"
          $errLog = Join-Path $env:TEMP "selftest_err.txt"
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          if (Test-Path $outLog) { Get-Content $outLog }
          if (Test-Path $errLog) { Get-Content $errLog }
          if ($proc.ExitCode -ne 0) { throw "PDFResize.exe --self-test exited with $($proc.ExitCode)" }
          Compress-Archive -Path "dist/PDF-Resize-Windows-x64/*" -DestinationPath "dist/PDF-Resize-Windows-x64.zip" -Force
          Get-Item "dist/PDF-Resize-Windows-x64.zip" | Select-Object Name, Length

      - name: Upload Windows WinUI 3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Resize-Windows-WinUI3-x64
          path: dist/PDF-Resize-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('PDF Resize {0}', github.ref_name) || 'PDF Resize 最新自动构建版 (Latest)' }}
          make_latest: true
          prerelease: false
          body: |
            ### PDF Resize 双平台纯原生桌面端安装包

            - **macOS 原生版 (`PDF-Resize-macOS-arm64.dmg`)**
              - 纯 Swift + SwiftUI + Liquid Glass 视觉语言构建（Apple Silicon `arm64` 原生，零网页套壳）
              - 双击打开 `.dmg`，将 `PDF Resize.app` 拖入 `Applications` 即可使用（若首次打开提示未公证，可在访达右键点击图标选「打开」或执行 `xattr -cr "/Applications/PDF Resize.app"`）
            - **Windows 原生版 (`PDF-Resize-Windows-x64.zip`)**
              - 纯 C# / .NET 8 + WinUI 3 (Microsoft Fluent 2 云母材质) 构建的自包含免安装绿色版
              - 已内置 .NET 8 与 Windows App SDK 1.6 运行时，解压到任意文件夹后直接双击 **`PDFResize.exe`** 即可运行
          files: |
            artifacts/PDF-Resize-macOS-Native/PDF-Resize-macOS-*.dmg
            artifacts/PDF-Resize-Windows-WinUI3-x64/PDF-Resize-Windows-x64.zip
